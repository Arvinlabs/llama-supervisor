name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: make test

  build-verify:
    strategy:
      matrix:
        platform:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build for ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null | sed 's/-g\([0-9a-f]\)/-\1/' || echo "dev")
          CGO_ENABLED=0 GOOS=${{ matrix.platform.os }} GOARCH=${{ matrix.platform.arch }} go build -v -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o llama-supervisor-${{ matrix.platform.os }}-${{ matrix.platform.arch }} .

      - name: Verify binary
        run: |
          file llama-supervisor-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          echo "Build successful for ${{ matrix.platform.os }}/${{ matrix.platform.arch }}"
