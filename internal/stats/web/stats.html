<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>stats</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --cache: #a8d4f7;
            --input: #56a1f0;
            --output: #1466f0;
            --grid: #e3e6ea;
            --axis-text: #6b7280;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 2rem auto;
            max-width: 1280px;
            background: #fff;
            color: #111;
            text-align: center;
        }

        button {
            padding: .3rem .9rem;
            background: #fff;
            border: 1px solid #d0d5dd;
            color: #344054;
            border-radius: 8px;
            font-size: .9rem;
            cursor: pointer;
        }

        button:hover {
            background: #f2f4f7;
        }

        .err {
            color: #c00;
        }

        .panel {
            max-width: 1200px;
            margin: 0 auto 1.5rem;
        }

        .panel-head {
            display: flex;
            justify-content: flex-end;
            margin-bottom: .6rem;
        }

        .card {
            background: #f1f2f4;
            border-radius: 16px;
            padding: 28px 32px 24px;
            margin: 0 auto;
            position: relative;
        }

        .card+.card {
            margin-top: 1.5rem;
        }

        .card-head {
            display: flex;
            justify-content: flex-start;
            align-items: baseline;
            text-align: left;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #111;
        }

        .card-total {
            font-size: 1.05rem;
            color: #8a909a;
            margin-left: .6rem;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        .chart-wrap {
            position: relative;
            margin-top: 1.8rem;
        }

        .chart {
            position: relative;
            height: 240px;
            margin-left: 56px;
            margin-bottom: 30px;
        }

        .gridline {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--grid);
        }

        .gridline.zero {
            background: #cfd4da;
        }

        .y-label {
            position: absolute;
            left: -56px;
            width: 46px;
            text-align: right;
            font-size: .95rem;
            color: var(--axis-text);
            font-variant-numeric: tabular-nums;
        }

        .x-label {
            position: absolute;
            bottom: -26px;
            transform: translateX(-50%);
            font-size: .9rem;
            color: var(--axis-text);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .cols {
            position: absolute;
            inset: 0;
            display: flex;
        }

        .col {
            position: relative;
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: default;
        }

        .col .bar {
            width: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .col .seg {
            width: 100%;
        }

        .seg.cache {
            background: var(--cache);
        }

        .seg.input {
            background: var(--input);
        }

        .seg.output {
            background: var(--output);
        }

        .col .hoverline {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 0;
            border-left: 1px dashed #b9c2cc;
            opacity: 0;
            pointer-events: none;
        }

        .col.active .hoverline {
            opacity: 1;
        }

        .tooltip {
            position: absolute;
            z-index: 10;
            display: none;
            background: #fff;
            border-radius: 14px;
            padding: 18px 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .08);
            min-width: 240px;
            pointer-events: none;
        }

        .tt-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 12px;
            text-align: left;
        }

        .tt-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: .95rem;
            text-align: left;
        }

        .tt-sw {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex: none;
        }

        .tt-label {
            color: #6b7280;
            flex: 1;
            text-align: left;
        }

        .tt-val {
            font-weight: 700;
            color: #111;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .table-wrap {
            max-width: 1200px;
            margin: 0 auto;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            padding: .45rem .8rem;
            border-bottom: 1px solid #e8eaf0;
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: #111;
            white-space: nowrap;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        th {
            font-weight: 500;
        }

        tr.total td {
            border-top: 1px solid #cfd4da;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            body {
                margin: 1rem;
            }

            .card {
                padding: 16px 14px 14px;
                border-radius: 12px;
            }

            .card+.card {
                margin-top: 1rem;
            }

            .chart {
                height: 180px;
                margin-left: 40px;
            }

            .y-label {
                left: -40px;
                width: 32px;
                font-size: .8rem;
            }

            .x-label {
                font-size: .75rem;
            }

            th,
            td {
                padding: .35rem .5rem;
                font-size: .8rem;
            }
        }
    </style>
</head>

<body>
    <span id="err" class="err"></span>
    <div class="panel" id="panel" hidden>
        <div class="panel-head"><button onclick="load()">refresh</button></div>
        <div class="card" id="hour-card" hidden>
            <div class="card-head"><span class="card-title" id="hour-title">Tokens</span><span class="card-total"
                    id="hour-total"></span></div>
            <div class="chart-wrap">
                <div class="chart" id="chart-hours"></div>
                <div class="tooltip" id="tip-hours"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-head"><span class="card-title" id="day-title">Tokens</span><span class="card-total"
                    id="card-total"></span></div>
            <div class="chart-wrap">
                <div class="chart" id="chart"></div>
                <div class="tooltip" id="tip"></div>
            </div>
        </div>
    </div>
    <div class="table-wrap">
        <table id="t" hidden>
            <thead>
                <tr>
                    <th>date</th>
                    <th>requests</th>
                    <th>input (k)</th>
                    <th>input cache (k)</th>
                    <th>output (k)</th>
                    <th>total (k)</th>
                    <th>cache hit</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        function k(n) { return (n / 1000).toFixed(2) + "k"; }
        function hit(input, cached) { return input > 0 ? (cached / input * 100).toFixed(2) + "%" : "-"; }
        function fmtNum(n) { return n.toLocaleString("en-US"); }
        function pad2(n) { return (n < 10 ? "0" : "") + n; }
        function fmtAxis(n) {
            if (n >= 1e6) { const v = n / 1e6; return (Number.isInteger(v) ? v : v.toFixed(1)) + "M"; }
            if (n >= 1e3) { const v = n / 1e3; return (Number.isInteger(v) ? v : v.toFixed(1)) + "K"; }
            return String(n);
        }
        function niceMax(v) {
            if (v <= 0) return 1;
            const p = Math.pow(10, Math.floor(Math.log10(v)));
            for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
            return 10 * p;
        }

        // renderChart draws a stacked bar chart into chartId. Each row carries
        // {input, input_cache, output, total}. labelOf(row) is the tooltip title and
        // tickOf(row, i, n) returns the x-axis label for that column (or null).
        function renderChart(chartId, tipId, rows, labelOf, tickOf) {
            const chart = document.getElementById(chartId);
            chart.innerHTML = "";
            const maxTotal = rows.reduce((m, x) => Math.max(m, x.total), 1);
            const top = niceMax(maxTotal);

            // gridlines: 0, half, top
            for (const [frac, val] of [[0, 0], [0.5, top / 2], [1, top]]) {
                const y = (1 - frac) * 100;
                const line = document.createElement("div");
                line.className = "gridline" + (frac === 0 ? " zero" : "");
                line.style.top = y + "%";
                const label = document.createElement("div");
                label.className = "y-label";
                label.style.top = "calc(" + y + "% - 0.6em)";
                label.textContent = fmtAxis(val);
                chart.appendChild(line);
                chart.appendChild(label);
            }

            const n = rows.length;
            const cols = document.createElement("div");
            cols.className = "cols";
            rows.forEach((x, i) => {
                const col = document.createElement("div");
                col.className = "col";
                const h = top ? x.total / top * 100 : 0;
                const seg = (cls, v) => v > 0 ? '<div class="seg ' + cls + '" style="height:' + (v / x.total * 100) + '%"></div>' : "";
                col.innerHTML =
                    '<div class="hoverline"></div>' +
                    '<div class="bar" style="height:' + h + '%">' +
                    seg("cache", x.input_cache) +
                    seg("input", Math.max(0, x.input - x.input_cache)) +
                    seg("output", x.output) +
                    '</div>';
                col.addEventListener("mouseenter", () => showTip(col, labelOf(x), x, tipId));
                col.addEventListener("mouseleave", () => hideTip(tipId));
                cols.appendChild(col);

                const tick = tickOf(x, i, n);
                if (tick != null) {
                    const lbl = document.createElement("div");
                    lbl.className = "x-label";
                    lbl.style.left = (i + 0.5) / n * 100 + "%";
                    lbl.textContent = tick;
                    chart.appendChild(lbl);
                }
            });
            chart.appendChild(cols);
        }

        function showTip(col, label, x, tipId) {
            const tip = document.getElementById(tipId);
            col.classList.add("active");
            tip.innerHTML =
                '<div class="tt-head"><span>' + label + '</span><span>' + fmtNum(x.total) + '</span></div>' +
                '<div class="tt-row"><span class="tt-sw" style="background:var(--cache)"></span><span class="tt-label">input (cached)</span><span class="tt-val">' + fmtNum(x.input_cache) + '</span></div>' +
                '<div class="tt-row"><span class="tt-sw" style="background:var(--input)"></span><span class="tt-label">input (not cached)</span><span class="tt-val">' + fmtNum(Math.max(0, x.input - x.input_cache)) + '</span></div>' +
                '<div class="tt-row"><span class="tt-sw" style="background:var(--output)"></span><span class="tt-label">output</span><span class="tt-val">' + fmtNum(x.output) + '</span></div>';
            tip.style.display = "block";
            const wrap = tip.parentElement;
            const wr = wrap.getBoundingClientRect();
            const cr = col.getBoundingClientRect();
            const tr = tip.getBoundingClientRect();
            let left = cr.left - wr.left + cr.width / 2 + 14;
            if (left + tr.width > wr.width) left = cr.left - wr.left + cr.width / 2 - tr.width - 14;
            left = Math.max(0, Math.min(left, wr.width - tr.width));
            let top = cr.top - wr.top + 60;
            top = Math.max(0, Math.min(top, wr.height - tr.height));
            tip.style.left = left + "px";
            tip.style.top = top + "px";
        }
        function hideTip(tipId) {
            const tip = document.getElementById(tipId);
            tip.style.display = "none";
            tip.parentElement.querySelectorAll(".col.active").forEach(c => c.classList.remove("active"));
        }

        // dayTicks returns up to 5 evenly-spaced column indices to label
        function dayTicks(n) {
            if (n <= 5) return Array.from({ length: n }, (_, i) => i);
            return [...new Set([0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1])];
        }
        function mdLabel(date) {
            const d = new Date(date + "T00:00:00");
            return (d.getMonth() + 1) + "/" + d.getDate();
        }

        // hourRows expands a day's per-hour buckets into a fixed 24-slot series (0-23)
        function hourRows(day) {
            const hours = day.hours || {};
            const rows = [];
            for (let h = 0; h < 24; h++) {
                const v = hours[h] || {};
                rows.push({
                    hour: h,
                    requests: v.requests || 0,
                    input: v.input || 0,
                    input_cache: v.input_cache || 0,
                    output: v.output || 0,
                    total: v.total || 0,
                });
            }
            return rows;
        }

        async function load() {
            const err = document.getElementById("err");
            err.textContent = "";
            try {
                const r = await fetch("/stats/data");
                if (!r.ok) throw new Error("HTTP " + r.status);
                const d = await r.json();
                const rows = d.days || [];
                document.getElementById("day-title").textContent = rows.length + " Days";

                // per-day chart (oldest day on the left)
                const dayRows = [...rows].reverse();
                const ticks = dayTicks(dayRows.length);
                renderChart("chart", "tip", dayRows,
                    x => x.date,
                    (x, i) => ticks.includes(i) ? mdLabel(x.date) : null);

                // per-hour chart for the newest day that carries hour data
                const hourCard = document.getElementById("hour-card");
                const hourDay = rows.find(x => x.hours && Object.keys(x.hours).length);
                if (hourDay) {
                    const hrows = hourRows(hourDay);
                    document.getElementById("hour-title").textContent = "Today";
                    document.getElementById("hour-total").textContent = k(hourDay.total);
                    renderChart("chart-hours", "tip-hours", hrows,
                        x => hourDay.date + " " + pad2(x.hour) + ":00",
                        x => (x.hour % 4 === 0) ? pad2(x.hour) : null);
                    hourCard.hidden = false;
                } else {
                    hourCard.hidden = true;
                }

                const tb = document.querySelector("#t tbody");
                tb.innerHTML = "";
                const sum = { requests: 0, input: 0, input_cache: 0, output: 0, total: 0 };
                for (const x of rows) {
                    for (const f of Object.keys(sum)) sum[f] += x[f];
                    const tr = document.createElement("tr");
                    tr.innerHTML =
                        "<td>" + x.date + "</td><td>" + x.requests + "</td>" +
                        "<td>" + k(x.input) + "</td><td>" + k(x.input_cache) + "</td>" +
                        "<td>" + k(x.output) + "</td><td>" + k(x.total) + "</td>" +
                        "<td>" + hit(x.input, x.input_cache) + "</td>";
                    tb.appendChild(tr);
                }
                if (rows.length) {
                    const tr = document.createElement("tr");
                    tr.className = "total";
                    tr.innerHTML =
                        "<td>total</td><td>" + sum.requests + "</td>" +
                        "<td>" + k(sum.input) + "</td><td>" + k(sum.input_cache) + "</td>" +
                        "<td>" + k(sum.output) + "</td><td>" + k(sum.total) + "</td>" +
                        "<td>" + hit(sum.input, sum.input_cache) + "</td>";
                    tb.appendChild(tr);
                    document.getElementById("card-total").textContent = k(sum.total);
                }
                document.getElementById("panel").hidden = rows.length === 0;
                document.getElementById("t").hidden = rows.length === 0;
                if (!rows.length) err.textContent = "no stats yet";
            } catch (e) {
                err.textContent = "failed to load: " + e.message;
            }
        }
        load();
    </script>
</body>

</html>
